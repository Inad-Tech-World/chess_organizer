[package]
name = "chess-organiser"
description = "Chess Organiser desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "chess-organiser"

[lib]
name = "chess_organiser_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
co-core.workspace = true
co-i18n.workspace = true
co-io.workspace = true
co-pairing.workspace = true
co-rating.workspace = true
co-store.workspace = true
co-tiebreak.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
