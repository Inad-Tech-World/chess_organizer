# Installers for macOS (universal) and Windows, attached to a draft GitHub
# release. Runs by hand once the repository variable RELEASES_ENABLED is
# "true". See docs/releasing.md.
#
# Without secrets the installers are unsigned and have no in-app updater.
# Optional repository secrets:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID        (macOS signing/notarising)
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     (update signing; also set the variable UPDATER_ENABLED to "true" and
#      put the public key in app/src-tauri/tauri.updater.conf.json)
# Windows code signing: see docs/releasing.md (SignPath for open source).
name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: vars.RELEASES_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --target universal-apple-darwin
          - os: windows-latest
            target: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Chess Organiser v__VERSION__
          releaseDraft: true
          prerelease: true
          args: >-
            ${{ matrix.target }}
            ${{ vars.UPDATER_ENABLED == 'true' && '--features updater --config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ vars.UPDATER_ENABLED == 'true' }}
